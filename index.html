<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Download Center</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 25px;
    font-size: 24px;
    font-weight: bold;
    background: #111827;
}

.container {
    max-width: 650px;
    margin: 70px auto;
    padding: 25px;
}

.cover {
    background: linear-gradient(135deg, #172554, #111827);
    border-radius: 18px;
    padding: 75px 20px;
    font-size: 45px;
    font-weight: bold;
}

h1 {
    font-size: 32px;
    margin-top: 30px;
}

.description {
    color: #aab3c5;
    line-height: 1.7;
}

.details {
    background: #151c2b;
    border-radius: 12px;
    padding: 20px;
    margin: 25px 0;
    line-height: 2;
}

.download {
    display: block;
    background: #16a34a;
    color: white;
    padding: 18px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 19px;
    font-weight: bold;
}

.download:hover {
    background: #15803d;
}

footer {
    color: #697386;
    padding: 30px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>GAME DOWNLOAD CENTER</header>

<div class="container">

<div class="cover">GAME</div>

<h1>Game Title</h1>

<p class="description">
Download your favorite game.
Fast, simple and easy downloads.
</p>

<div class="details">
Version: 1.0<br>
Platform: iOS<br>
File Size: 60 MB<br>
Price: FREE
</div>

<a class="download" href="#">
DOWNLOAD NOW
</a>

</div>

<footer>
Game Download Center © 2026
</footer>

</body>
</html>
